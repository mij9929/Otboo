# docker-compose-dev.yml
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: otboo-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./api/src/main/resources/static:/usr/share/nginx/html:ro
    depends_on:
      - app-1
      - app-2
    networks:
      - otboo-net
  app-1:
    image: otboo-app-1:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otboo-app-1
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - INSTANCE_ID=app-1

      - SPRING_ELASTICSEARCH_URIS=${SPRING_ELASTICSEARCH_URIS}
      - SPRING_ELASTICSEARCH_USERNAME=${SPRING_ELASTICSEARCH_USERNAME}
      - SPRING_ELASTICSEARCH_PASSWORD=${SPRING_ELASTICSEARCH_PASSWORD}

      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRATION=${ACCESS_TOKEN_EXPIRATION}
      - REFRESH_TOKEN_EXPIRATION=${REFRESH_TOKEN_EXPIRATION}
      - ISSUER=${ISSUER}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - KMA_API_KEY=${KMA_API_KEY}

      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      - NAVER_MAIL_ID=${NAVER_MAIL_ID}
      - NAVER_MAIL_PASSWORD=${NAVER_MAIL_PASSWORD}

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      - SECURE=${SECURE}
      - SAMESITE=${SAMESITE}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      - RECOMMENDATION_LLM_API_KEY=${RECOMMENDATION_LLM_API_KEY}

    depends_on:
      - redis
      - es
      - kafka
    restart: on-failure
    networks:
      - otboo-net

  app-2:
    image: otboo-app-2:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otboo-app-2
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - INSTANCE_ID=app-2

      - SPRING_ELASTICSEARCH_URIS=${SPRING_ELASTICSEARCH_URIS}
      - SPRING_ELASTICSEARCH_USERNAME=${SPRING_ELASTICSEARCH_USERNAME}
      - SPRING_ELASTICSEARCH_PASSWORD=${SPRING_ELASTICSEARCH_PASSWORD}

      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRATION=${ACCESS_TOKEN_EXPIRATION}
      - REFRESH_TOKEN_EXPIRATION=${REFRESH_TOKEN_EXPIRATION}
      - ISSUER=${ISSUER}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - KMA_API_KEY=${KMA_API_KEY}

      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      - NAVER_MAIL_ID=${NAVER_MAIL_ID}
      - NAVER_MAIL_PASSWORD=${NAVER_MAIL_PASSWORD}

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      - SECURE=${SECURE}
      - SAMESITE=${SAMESITE}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - redis
      - es
      - kafka
    restart: on-failure
    networks:
      - otboo-net

  es:
    build:
      context: .
      dockerfile: elasticsearch/elasticsearch.Dockerfile
    container_name: otboo-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - otboo-net
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: otboo-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
    ports:
      - "5601:5601"
    depends_on:
      - es
    networks:
      - otboo-net

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - otboo-net

  kafka:
    image: apache/kafka:3.7.1  # 공식 Kafka 이미지
    container_name: kafka_broker
    hostname: kafka  # 컨테이너 내부 DNS 이름

    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
      # 호스트 → 컨테이너 포트 매핑
      # 로컬 Spring Boot는 localhost:${KAFKA_PORT}로 접속

    environment:
      # ===== KRaft 기본 설정 =====
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 단일 노드에서 broker와 controller 역할을 함께 수행

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT}
      # 단일 노드 KRaft controller quorum 설정

      # ===== Listener 설정 =====
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:${KAFKA_PORT},CONTROLLER://:${KAFKA_CONTROLLER_PORT}
      # Kafka가 실제로 바인딩할 주소
      # INTERNAL: Docker 네트워크 내부 통신용
      # EXTERNAL: 로컬 PC에서 접근하는 Spring Boot용
      # CONTROLLER: KRaft controller 통신용

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      # Kafka가 클라이언트에게 알려줄 접속 주소
      # Docker 컨테이너 내부 클라이언트는 kafka:29092 사용
      # 로컬 Spring Boot는 localhost:${KAFKA_PORT} 사용

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      # listener 이름별 보안 프로토콜 매핑
      # 로컬 개발 환경이므로 모두 PLAINTEXT 사용

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # broker 간 통신에 사용할 listener
      # 단일 브로커여도 Kafka 설정상 필요

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # controller 역할에 사용할 listener

      # ===== 토픽/파티션 설정 =====
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 토픽이 없으면 자동 생성
      # 개발 환경에서는 편하지만 운영 환경에서는 명시 생성 권장

      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS}
      # 자동 생성 토픽의 기본 파티션 수

      # ===== 단일 브로커 필수 설정 =====
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 단일 브로커 환경에서는 replication 관련 값을 1로 설정해야 정상 기동 가능

      # ===== KRaft 클러스터 식별자 =====
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      # Kafka 스토리지 포맷에 사용되는 클러스터 ID
      # 최초 생성 후에는 동일한 volume을 쓰는 동안 고정해야 함

    volumes:
      - kafka_data:/var/lib/kafka/data
      # Kafka 로그와 메타데이터 저장
      # 컨테이너를 재시작해도 데이터 유지
    networks:
      - otboo-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka_ui

    ports:
      - "${KAFKA_UI_PORT}:8080"
      # 브라우저에서 Kafka UI에 접근할 포트
      # 예: localhost:${KAFKA_UI_PORT}

    depends_on:
      - kafka
      # kafka 컨테이너를 먼저 시작

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Kafka UI에 표시될 클러스터 이름

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # Kafka UI는 Docker 컨테이너 내부에서 Kafka에 접근함
      # 따라서 localhost가 아니라 Docker DNS 이름인 kafka 사용
      # INTERNAL listener의 advertised 주소와 맞춰 kafka:29092 사용
    networks:
      - otboo-net

volumes:
  es-data:
    driver: local
  redis-data:
    driver: local
  kafka_data:
    driver: local

networks:
  otboo-net:
    driver: bridge