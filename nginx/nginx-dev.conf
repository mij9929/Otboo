events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream otboo_backend {
        server otboo-app-1:8080;
        server otboo-app-2:8080;
    }

    server {
        listen 80;

        location /health {
            return 200 "nginx up";
            add_header Content-Type text/plain;
        }

        # OAuth 시작
        location /oauth2/ {
            proxy_pass http://otboo_backend;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Docker: localhost:3000 -> nginx:80 구조라 server_port는 80이므로 dev에서는 3000 명시
            proxy_set_header X-Forwarded-Host localhost;
            proxy_set_header X-Forwarded-Port 3000;

            add_header X-Upstream-Server $upstream_addr always;
        }

        # OAuth 콜백
        location /login/oauth2/ {
            proxy_pass http://otboo_backend;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Docker: localhost:3000 -> nginx:80 구조라 server_port는 80이므로 dev에서는 3000 명시
            proxy_set_header X-Forwarded-Host localhost;
            proxy_set_header X-Forwarded-Port 3000;

            add_header X-Upstream-Server $upstream_addr always;
        }

        # SSE
        location ^~ /api/sse {
            proxy_pass http://otboo_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host localhost;
            proxy_set_header X-Forwarded-Port 3000;

            add_header X-Accel-Buffering no always;
            add_header Cache-Control no-cache always;
            add_header X-Upstream-Server $upstream_addr always;
        }

        # REST API
        location /api/ {
            proxy_pass http://otboo_backend;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host localhost;
            proxy_set_header X-Forwarded-Port 3000;

            add_header X-Upstream-Server $upstream_addr always;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://otboo_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host localhost;
            proxy_set_header X-Forwarded-Port 3000;

            add_header X-Upstream-Server $upstream_addr always;
        }

        # React/Vite SPA
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}