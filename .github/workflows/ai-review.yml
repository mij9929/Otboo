name: AI Code Reviewer

### opened      → 첫 리뷰
### synchronize → 수정 반영 후 재리뷰
### reopened    → 다시 작업 시작 시 리뷰
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Wait for CI to succeed
        uses: fountainhead/action-wait-for-check@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: CI Test Job
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare PR Diff Chunks
        id: chunks
        shell: bash
        run: |
          set -e

          git fetch origin "${{ github.base_ref }}" --depth=1

          mkdir -p diff_chunks

          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '(\.java|\.yml|\.yaml|\.properties|\.gradle|\.sql|\.xml|\.json|Dockerfile)$' \
            | grep -v -E '(^|/)(build|target|generated|node_modules)/' \
            || true)

          if [ -z "$FILES" ]; then
            echo "has_chunks=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          chunk_index=0
          max_lines=500
          split_threshold=900

          for file in $FILES; do
            if [ ! -f "$file" ]; then
              continue
            fi

            git diff --unified=20 origin/${{ github.base_ref }}...HEAD -- "$file" > "file.diff"

            if [ ! -s "file.diff" ]; then
              continue
            fi

            line_count=$(wc -l < file.diff | tr -d ' ')

            if [ "$line_count" -le "$split_threshold" ]; then
              safe_name=$(echo "$file" | sed 's#[/ ]#_#g')
              cp "file.diff" "diff_chunks/chunk_${chunk_index}_${safe_name}.diff"
              chunk_index=$((chunk_index + 1))
            else
              split -l "$max_lines" -d -a 3 "file.diff" "diff_chunks/chunk_${chunk_index}_part_"

              for chunk in diff_chunks/chunk_${chunk_index}_part_*; do
                mv "$chunk" "${chunk}.diff"
              done

              chunk_index=$((chunk_index + 1))
            fi
          done

          rm -f file.diff

          count=$(ls diff_chunks/*.diff 2>/dev/null | wc -l | tr -d ' ')

          if [ "$count" -eq 0 ]; then
            echo "has_chunks=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_chunks=true" >> "$GITHUB_OUTPUT"
            echo "chunk_count=$count" >> "$GITHUB_OUTPUT"
          fi

      - name: Groq AI Review
        if: steps.chunks.outputs.has_chunks == 'true'
        uses: actions/github-script@v7
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- ai-code-reviewer -->';
            const chunkDir = 'diff_chunks';

            const MAX_CHUNKS = 3;
            const MAX_LINE_COMMENTS = 2;
            
            function sleep(ms) {
              return new Promise(resolve => setTimeout(resolve, ms));
            }

            function priorityScore(fileName) {
              const critical = [
                'Security',
                'Jwt',
                'OAuth',
                'Auth',
                'Redis',
                'Kafka',
                'Sse',
                'WebSocket',
                'Batch',
                'QueryDsl',
                'Repository',
                'Service',
                'Config',
                'Controller'
              ];

              const matched = critical.some(keyword =>
                fileName.toLowerCase().includes(keyword.toLowerCase())
              );

              return matched ? 0 : 1;
            }

            function cleanDiff(diff) {
              return diff
                .split('\n')
                .filter(line => !line.match(/^\+import\s+/))
                .filter(line => !line.match(/^-import\s+/))
                .join('\n');
            }
            
            function truncateDiff(diff, maxChars = 12000) {
              if (diff.length <= maxChars) {
                return diff;
              }
            
              return diff.slice(0, maxChars) + '\n\n[diff truncated]';
            }

            function extractChangedLines(diff) {
              const result = new Map();

              let currentFile = null;
              let newLine = 0;

              for (const line of diff.split('\n')) {
                if (line.startsWith('+++ b/')) {
                  currentFile = line.replace('+++ b/', '').trim();
                  if (!result.has(currentFile)) {
                    result.set(currentFile, new Set());
                  }
                  continue;
                }

                const hunk = line.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (hunk) {
                  newLine = Number(hunk[1]);
                  continue;
                }

                if (!currentFile || line.startsWith('---')) {
                  continue;
                }

                if (line.startsWith('+') && !line.startsWith('+++')) {
                  result.get(currentFile).add(newLine);
                  newLine++;
                } else if (line.startsWith('-') && !line.startsWith('---')) {
                  continue;
                } else {
                  newLine++;
                }
              }

              return result;
            }

            function mergeChangedLines(files) {
              const merged = new Map();

              for (const file of files) {
                const diff = fs.readFileSync(path.join(chunkDir, file), 'utf8');
                const map = extractChangedLines(diff);

                for (const [fileName, lines] of map.entries()) {
                  if (!merged.has(fileName)) {
                    merged.set(fileName, new Set());
                  }

                  for (const line of lines) {
                    merged.get(fileName).add(line);
                  }
                }
              }

              return merged;
            }

            async function requestGroq(messages, maxTokens = 1200, retry = 0) {
              const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${process.env.GROQ_API_KEY}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  model: 'llama-3.3-70b-versatile',
                  temperature: 0.2,
                  max_tokens: maxTokens,
                  messages
                })
              });

              if (response.status === 429 && retry < 4) {
                const wait = 4000 * (retry + 1);
                await sleep(wait);
                return requestGroq(messages, maxTokens, retry + 1);
              }

              if (!response.ok) {
                const text = await response.text();
                throw new Error(`Groq API error: ${response.status} ${text}`);
              }

              const data = await response.json();
              return data.choices?.[0]?.message?.content ?? '';
            }

            async function requestChunkReview(diff, index, total) {
              return requestGroq([
                {
                  role: 'system',
                  content: `
            너는 Spring Boot 3 기반 백엔드 코드 리뷰어다.
            PR diff만 보고 리뷰한다.
            추측하지 않는다.
            한국어로 간결하게 작성한다.

            프로젝트 특성:
            - Spring Boot 3
            - Spring Security JWT/OAuth2
            - JPA/QueryDSL
            - Redis
            - Kafka
            - SSE/WebSocket
            - Spring Batch
            - Elasticsearch
            - Docker/GitHub Actions

            리뷰 기준:
            1. 실제 동작 오류 가능성
            2. null/empty/exception 처리 누락
            3. validation 누락
            4. 책임 분리 위반
            5. 중복 로직
            6. 불필요하게 복잡한 코드
            7. 테스트 필요 지점
            8. API 응답/예외 일관성
            9. 트랜잭션 경계
            10. 성능 병목 가능성

            위험 영역별 추가 기준:
            - Security/JWT/OAuth: 인증 우회, 토큰 검증, 쿠키 보안, 권한 체크 누락
            - JPA/QueryDSL: N+1, 잘못된 fetch join, lazy loading 문제, pagination 문제
            - Redis: TTL 누락, atomicity, key 설계
            - Kafka/SSE/WebSocket: 중복 전송, consumer group, emitter lifecycle, 재연결 처리
            - Batch: chunk size, restartability, idempotency
            - Elasticsearch: 색인 정합성, fallback, health dependency
            - Infra: secret 노출, profile 분리, prod/dev 설정 혼합

            출력 형식:
            ## 요약
            ## 반드시 수정할 부분
            ## 개선하면 좋은 부분
            ## 테스트 제안

            중요한 문제가 없으면 "특이사항 없음"이라고 한다.
                  `.trim()
                },
                {
                  role: 'user',
                  content: `PR diff chunk ${index}/${total}를 리뷰해줘:\n\n${diff}`
                }
              ]);
            }

            async function requestInlineComments(diff) {
              const raw = await requestGroq([
                {
                  role: 'system',
                  content: `
            너는 GitHub PR line comment 생성기다.
            반드시 JSON만 출력한다.
            markdown 설명을 붙이지 않는다.
            diff에서 실제로 추가/수정된 줄에 대해서만 코멘트한다.
            확실한 문제만 지적한다.
            단순 스타일 취향은 제외한다.

            JSON 형식:
            {
              "comments": [
                {
                  "path": "src/main/java/example/Foo.java",
                  "line": 42,
                  "body": "이 줄에 대한 한국어 리뷰 코멘트"
                }
              ]
            }

            comments는 최대 5개만 작성한다.
            지적할 내용이 없으면 {"comments": []} 를 출력한다.
                  `.trim()
                },
                {
                  role: 'user',
                  content: `다음 diff에서 라인 단위 코멘트 후보를 만들어줘:\n\n${diff}`
                }
              ], 1000);

              try {
                const jsonText = raw
                  .replace(/^```json\s*/i, '')
                  .replace(/^```\s*/i, '')
                  .replace(/```$/i, '')
                  .trim();

                const parsed = JSON.parse(jsonText);
                return Array.isArray(parsed.comments) ? parsed.comments : [];
              } catch {
                  core.warning('Failed to parse inline comments JSON');
                  core.warning(raw);
                  return [];
                }
            }

            async function requestFinalSummary(reviews) {
              return requestGroq([
                {
                  role: 'system',
                  content: `
            너는 PR 전체 리뷰 요약자다.
            여러 chunk 리뷰 결과를 종합해서 한국어로 간결하게 정리한다.
            중복 지적은 합친다.
            확실하지 않은 내용은 "확인 필요"로 표시한다.

            출력 형식:
            ## 전체 요약
            ## 우선순위 높은 수정사항
            ## 리팩터링 방향
            ## 테스트 우선순위
                  `.trim()
                },
                {
                  role: 'user',
                  content: `다음 chunk 리뷰 결과들을 종합해줘:\n\n${reviews.join('\n\n---\n\n')}`
                }
              ], 1400);
            }
            
            function extractOriginalName(fileName) {
              return fileName.replace(/^chunk_\d+_/, '');
            }

            const allDiffFiles = fs.readdirSync(chunkDir)
              .filter(name => name.endsWith('.diff'))
              .sort((a, b) => {
              const score =
              priorityScore(extractOriginalName(a)) -
              priorityScore(extractOriginalName(b));
              
              return score !== 0 ? score : a.localeCompare(b);
            });

            const selectedFiles = allDiffFiles.slice(0, MAX_CHUNKS);
            const changedLines = mergeChangedLines(selectedFiles);

            const reviews = [];
            const inlineCommentCandidates = [];

            for (let i = 0; i < selectedFiles.length; i++) {
              const filePath = path.join(chunkDir, selectedFiles[i]);
            
              const rawDiff = fs.readFileSync(filePath, 'utf8');
            
              const cleanedDiff = cleanDiff(rawDiff);
              const truncatedDiff = truncateDiff(cleanedDiff);
            
              if (cleanedDiff.trim().length === 0) {
              core.info(`No reviewable diff after cleaning: ${selectedFiles[i]}`);
              continue;
            }
            
              const review = await requestChunkReview(
              truncatedDiff,
              i + 1,
              selectedFiles.length
              );
            
              reviews.push(`## Review ${i + 1}: ${selectedFiles[i]}\n\n${review}`);
            
              // 라인 코멘트는 truncate
              if (i < 2) {
              const candidates = await requestInlineComments(rawDiff);
              inlineCommentCandidates.push(...candidates);
            }

              await sleep(4000);
            }
            
            if (reviews.length === 0) {
              core.info('No reviewable diff after cleaning.');
              return;
            }

            const finalSummary = await requestFinalSummary(reviews);

            const truncatedNotice = allDiffFiles.length > selectedFiles.length
              ? `\n\n> 무료 tier 보호를 위해 일부 diff는 생략되었습니다. 리뷰된 chunk: ${selectedFiles.length}/${allDiffFiles.length}개\n`
              : '';

            const body = `${marker}
            ### AI Code Review

            ${finalSummary}

            <details>
            <summary>Chunk별 상세 리뷰</summary>

            ${reviews.join('\n\n---\n\n')}

            </details>
            ${truncatedNotice}
            `;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

            const validInlineComments = inlineCommentCandidates
              .filter(comment => comment.path && Number.isInteger(comment.line) && comment.body)
              .filter(comment => changedLines.has(comment.path))
              .filter(comment => changedLines.get(comment.path).has(comment.line))
              .slice(0, MAX_LINE_COMMENTS)
              .map(comment => ({
                path: comment.path,
                line: comment.line,
                side: 'RIGHT',
                body: comment.body
              }));

            if (validInlineComments.length > 0) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'COMMENT',
                body: 'AI line review comments',
                comments: validInlineComments
              });
            }